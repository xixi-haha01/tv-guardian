name: Build TVGuardian APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/g.zip
          unzip -q -d /opt /tmp/g.zip
          echo "/opt/gradle-8.7/bin" >> $GITHUB_PATH
      - name: Build APK
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: tvguardian-apk
          path: app/build/outputs/apk/*/app-*.apk
